name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Verify application files
        run: |
          test -f Project-3-CICD-Pipeline/index.html
          test -f Project-3-CICD-Pipeline/README.md
          echo "Application files verified successfully."
      - name: Run basic test
        run: |
          grep -q "DecodeLabs Project 3" Project-3-CICD-Pipeline/index.html
          echo "Test passed successfully."
      - name: Create artifact
        run: |
          mkdir -p build
          cp Project-3-CICD-Pipeline/index.html build/
          cp Project-3-CICD-Pipeline/README.md build/
          echo "Build artifact created."
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: decodelabs-project-3
          path: build/
      - name: Download artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/download-artifact@v4
        with:
          name: decodelabs-project-3
          path: deploy/
      - name: Deploy to EC2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "deploy/index.html,deploy/README.md"
          target: "~/decodelabs-project-3"
          strip_components: 1
